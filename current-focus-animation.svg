<svg viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c1c3"/>
      <stop offset="100%" stop-color="#0e75b6"/>
    </radialGradient>
  </defs>

  <!-- orbit rings -->
  <circle cx="300" cy="160" r="70" fill="none" stroke="#30363d" stroke-width="1"/>
  <circle cx="300" cy="160" r="130" fill="none" stroke="#21262d" stroke-width="1"/>

  <!-- core -->
  <circle cx="300" cy="160" r="42" fill="url(#core)">
    <animate attributeName="r" values="40;44;40" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <text x="300" y="155" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Product-Minded</text>
  <text x="300" y="170" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Engineering</text>

  <!-- inner orbit: 3 nodes rotating -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 300 160" to="360 300 160" dur="14s" repeatCount="indefinite"/>
    <g>
      <circle cx="370" cy="160" r="16" fill="#7b2ff7"/>
      <text x="370" y="164" text-anchor="middle" fill="white" font-size="9" transform="rotate(0 370 160)">AI</text>
    </g>
    <g transform="rotate(120 300 160)">
      <circle cx="370" cy="160" r="16" fill="#f7971e"/>
      <text x="370" y="164" text-anchor="middle" fill="white" font-size="9" transform="rotate(-120 370 160)">Auto</text>
    </g>
    <g transform="rotate(240 300 160)">
      <circle cx="370" cy="160" r="16" fill="#e63946"/>
      <text x="370" y="164" text-anchor="middle" fill="white" font-size="8" transform="rotate(-240 370 160)">Data</text>
    </g>
  </g>

  <!-- outer orbit: 3 nodes rotating opposite direction -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 300 160" to="0 300 160" dur="20s" repeatCount="indefinite"/>
    <g>
      <circle cx="430" cy="160" r="18" fill="#0e75b6"/>
      <text x="430" y="164" text-anchor="middle" fill="white" font-size="8" transform="rotate(0 430 160)">Backend</text>
    </g>
    <g transform="rotate(120 300 160)">
      <circle cx="430" cy="160" r="18" fill="#22c1c3"/>
      <text x="430" y="164" text-anchor="middle" fill="white" font-size="8" transform="rotate(-120 430 160)">Cloud</text>
    </g>
    <g transform="rotate(240 300 160)">
      <circle cx="430" cy="160" r="18" fill="#2b81b6"/>
      <text x="430" y="164" text-anchor="middle" fill="white" font-size="7" transform="rotate(-240 430 160)">Architecture</text>
    </g>
  </g>

  <text x="300" y="305" text-anchor="middle" fill="#8b949e" font-size="12">AI · Automation · Data · Backend · Cloud · Architecture</text>
</svg>
